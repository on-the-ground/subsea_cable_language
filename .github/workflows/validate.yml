name: Validate language base

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement site/requirements.txt

      - name: Build canonical documentation projection strictly
        run: mkdocs build --strict --config-file site/mkdocs.yml --site-dir "${{ runner.temp }}/subsea-cable-site"
