name: Deploy documentation site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install site dependencies
        run: python -m pip install --requirement site/requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build canonical documentation projection
        run: mkdocs build --strict --config-file site/mkdocs.yml --site-dir "${{ runner.temp }}/subsea-cable-site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ runner.temp }}/subsea-cable-site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
